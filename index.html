
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تقديم كلان روزهوك</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }

    .top-bar {
      background-color: black;
      color: white;
      text-align: center;
      padding: 10px;
      font-size: 20px;
    }

    .center-box {
      background-color: yellow;
      width: 300px;
      margin: 100px auto;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
    }

    .form-container {
      display: none;
      margin: 20px auto;
      width: 300px;
      background-color: #fff;
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 10px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"], select {
      width: 100%;
      margin-bottom: 15px;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .submit-btn {
      background-color: green;
      color: white;
      padding: 10px;
      border: none;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    .success-message {
      text-align: center;
      color: green;
      margin-top: 10px;
      font-weight: bold;
    }

    .notice-bar {
      display: none;
      background-color: black;
      color: white;
      text-align: center;
      padding: 10px;
      font-size: 18px;
      margin-top: -20px;
    }
  </style>
</head>
<body>

  <div class="top-bar">مرحبا بكم في موقع تقديم الكلان عمو روزهوك</div>

  <div class="center-box" onclick="showForm()">الدخول</div>

  <div class="notice-bar" id="noticeBar">قوم باستكمال الطلبات</div>

  <div class="form-container" id="formContainer">
    <label>العمر:</label>
    <input type="text" id="age" placeholder="ادخل عمرك" required>

    <label>حدد شخصيتك:</label>
    <select id="gender">
      <option value="">اختر</option>
      <option value="ذكر">ذكر</option>
      <option value="أنثى">أنثى</option>
    </select>

    <label>هل أنت لاعب أم تنشر في تيك توك؟</label>
    <select id="role">
      <option value="">اختر</option>
      <option value="تيكتوكر">تيكتوكر</option>
      <option value="لاعب">لاعب</option>
    </select>

    <label>شنو لعبك:</label>
    <select id="playStyle">
      <option value="">اختر</option>
      <option value="لاعب سكرمات + فاينلات">لاعب سكرمات + فاينلات</option>
      <option value="لاعب عادي">لاعب عادي</option>
      <option value="مشهور">مشهور</option>
      <option value="دوده">دوده</option>
    </select>

    <button class="submit-btn" onclick="sendToTelegram()">إرسال</button>

    <div class="success-message" id="successMsg"></div>
  </div>

  <script>
    function showForm() {
      document.getElementById('formContainer').style.display = 'block';
      document.getElementById('noticeBar').style.display = 'block';
    }

    function sendToTelegram() {
      const age = document.getElementById('age').value;
      const gender = document.getElementById('gender').value;
      const role = document.getElementById('role').value;
      const playStyle = document.getElementById('playStyle').value;

      if (!age || !gender || !role || !playStyle) {
        alert('يرجى تعبئة جميع الحقول.');
        return;
      }

      const message = `طلب تقديم جديد:
العمر: ${age}
الشخصية: ${gender}
الدور: ${role}
طريقة اللعب: ${playStyle}`;

      const botToken = '8106591798:AAHxjQL4SOAZjq9tjb3GKICc1BmKd4qqrmo';
      const chatId = '6741298162';
      const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: chatId,
          text: message
        })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById('successMsg').innerText = "تم الإرسال، انتظر الرد بأقرب وقت.";
      })
      .catch(err => {
        alert("حدث خطأ أثناء الإرسال.");
        console.error(err);
      });
    }
  </script>

</body>
</html>
